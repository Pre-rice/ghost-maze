<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>鬼迷宫</title><link rel="icon" type="image/svg+xml" href="favicon.svg"><link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="play-screen" class="main-container"><div class="canvas-wrapper">
    <canvas id="game-canvas" width="600" height="600" aria-label="迷宫地图"></canvas>
    <div id="layer-panel" class="layer-panel" style="display:none">
        <div id="layer-buttons-container"></div>
        <div id="layer-edit-controls" style="display:none"></div>
    </div>
</div><div class="controls-panel"><div id="game-controls">
    <div class="control-group">
        <div class="panel-header">
        <h1 id="mode-display" class="panel-title">尚未开始</h1>
        <nav class="header-controls" aria-label="页面导航">
            <a href="maps.html" class="home-btn gallery-link" title="地图集" aria-label="地图集"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5.5 8 4v15l-4 1.5zm6-1.5 4 1.5v15L10 19zm6 1.5 4-1.5v15l-4 1.5z"/></svg></a>

            <a href="editor.html" id="edit-map-btn" class="home-btn" title="进入编辑器" aria-label="进入编辑器"><svg viewBox="0 0 24 24"><path d="m3 17 4 4L21 7l-4-4L3 17zm0 0v4h4"/></svg></a>
            <a href="help.html" class="help-btn" title="查看帮助" aria-label="查看帮助"><svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20zm1 17h-2v-2h2zm2-7-1 1c-1 1-1 1-1 2h-2v-1c0-1 1-2 2-3l1-1a2 2 0 1 0-4-1H8a4 4 0 1 1 7 3z"/></svg></a>
            <div class="theme-toggle" id="theme-toggle"><button class="theme-toggle-btn" id="theme-toggle-btn" title="切换主题" aria-label="切换主题"><svg id="theme-icon" viewBox="0 0 24 24"></svg></button></div>
        </nav>
        </div>
        <div id="status-bar" class="status-bar">
            <div id="player-health-display" class="label">生命: —</div>
            <div id="player-steps-display" class="label">步数: 0</div>
            <div id="player-keys-display" class="label">钥匙: 0</div>
            <div id="ghost-proximity-display" class="label">周围鬼数: 0</div>
        </div>
    </div>
    <div id="play-options-controls" class="control-group">
        <div id="play-history-controls" class="share-buttons-container">
            <button id="undo-btn" class="secondary">撤回</button><button id="save-btn" class="secondary">存档</button><button id="rewind-btn" class="secondary">回溯</button>
        </div>
        <div id="view-options-controls" class="toggle-controls-wrapper">
            <div id="full-vision-control" class="toggle-switch"><span class="label">全图视野</span><input type="checkbox" id="full-vision-toggle"><label for="full-vision-toggle">全图视野</label></div>
            <div id="dpad-toggle-control" class="toggle-switch"><span class="label">方向按键</span><input type="checkbox" id="dpad-toggle" checked><label for="dpad-toggle">方向按键</label></div>
        </div>
        <div id="map-actions" class="map-actions"><button id="reset-map-btn" class="secondary">重置</button><button id="watch-replay-btn" class="secondary">回放</button><button id="solve-map-btn" class="secondary">求解</button></div>
        <button id="generate-map-btn">随机生成新地图</button>
    </div>
    <div id="replay-controls" class="control-group" hidden>
        <div class="share-buttons-container"><button id="replay-prev-btn" class="secondary">上一步</button><button id="replay-play-btn">播放</button><button id="replay-next-btn" class="secondary">下一步</button></div>
        <div class="inline-control-group">
            <label for="replay-speed">播放速度</label>
            <select id="replay-speed"><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select>
        </div>
        <div class="inline-control-group">
            <label for="replay-step-input">步数</label><input id="replay-step-input" type="number" min="0" value="0"><span id="replay-total"></span>
        </div>
        <input type="range" id="replay-step-range" min="0" value="0" aria-label="选择回放步数">
        <button id="replay-load-btn">加载该步</button><button id="replay-close-btn" class="secondary">返回游玩</button>
    </div>
</div></div></div><div id="death-overlay" class="overlay"><div class="overlay-content">
    <h2 id="death-message">你死了</h2><div class="buttons"><button id="death-undo-btn">撤回该步</button><button id="revive-btn" class="secondary">复活</button><button id="death-rewind-btn" class="secondary">回到上一个存档点</button><button id="death-reset-btn" class="secondary">重置地图</button></div>
</div></div>
<div id="game-over-overlay" class="overlay"><div class="overlay-content">
    <h2>生命耗尽</h2><div class="buttons"><button id="game-over-undo-btn">撤回该步</button><button id="game-over-rewind-btn" class="secondary">回到上一个存档点</button><button id="game-over-replay-btn" class="secondary">重置地图</button></div>
</div></div>
<div id="win-overlay" class="overlay"><div class="overlay-content">
    <h2>你赢了！</h2><p id="win-stats"></p><div class="buttons"><button id="win-watch-replay-btn">回放</button><button id="win-replay-btn" class="secondary">重置地图</button></div>
</div></div>
<div id="new-map-overlay" class="overlay" role="dialog" aria-modal="true" aria-labelledby="new-map-title">
    <form id="new-map-form" class="overlay-content">
        <h2 id="new-map-title">随机生成新地图</h2>
        <div class="new-map-options">
            <label for="new-map-size">地图大小（8–20）</label>
            <input id="new-map-size" type="number" min="8" max="20" value="10" required>
            <div id="new-map-health-control">
                <label for="new-map-health">初始生命</label>
                <input id="new-map-health" type="number" min="1" max="4294967295" value="5" required>
            </div>
        </div>
        <div class="buttons"><button type="submit">生成地图</button><button id="new-map-cancel-btn" type="button" class="secondary">取消</button></div>
    </form>
</div>
        <!-- Custom Confirm Overlay -->
        <div id="confirm-overlay" class="overlay">
            <div class="overlay-content">
                <p id="confirm-message">你确定吗？</p>
                <div class="buttons">
                    <button id="confirm-yes-btn" class="danger">确认</button>
                    <button id="confirm-no-btn" class="secondary">取消</button>
                </div>
            </div>
        </div>

<div id="dpad-controls" class="hidden"><div id="dpad-up" class="dpad-btn">▲</div><div id="dpad-left" class="dpad-btn">◀</div><div id="dpad-center" class="dpad-btn dpad-center">●</div><div id="dpad-right" class="dpad-btn">▶</div><div id="dpad-down" class="dpad-btn">▼</div></div><div id="toast-notification" class="toast" role="status"></div>
<script src="src/vendor/pako.js"></script><script type="module" src="src/app.js"></script>
</body></html>
