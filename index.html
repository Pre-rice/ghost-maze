tion>

troke="var(--wall-color)" stroke-width="3"/> </svg></button><button id="tool-lock" data-editor-tool="lock" class="tool-btn icon-btn" title="数字门" aria-label="数字门"><svg viewBox="0 0 24 24" width="24" height="24"> <line x1="2" y1="12" x2="22" y2="12" stroke="var(--wall-color)" stroke-width="3"/> <text x="12" y="16" font-size="12" fill="var(--key-color)" text-anchor="middle" font-weight="bold" stroke="var(--wall-color)" stroke-width="0.5">1</text> </svg></button><button id="tool-oneway" data-editor-tool="oneway" class="tool-btn icon-btn" title="单向门" aria-label="单向门"><svg viewBox="0 0 24 24" width="24" height="24"> <line x1="2" y1="12" x2="22" y2="12" stroke="var(--wall-color)" stroke-width="3"/> <text x="12" y="20" font-size="16" fill="var(--key-color)" text-anchor="middle" font-weight="bold" stroke="var(--wall-color)" stroke-width="0.5">^</text> </svg></button><button id="tool-glass" data-editor-tool="glass" class="tool-btn icon-btn" title="玻璃" aria-label="玻璃"><svg viewBox="0 0 24 24" width="24" height="24"> <line x1="5" y1="15" x2="9" y2="9" stroke="var(--wall-color)" stroke-width="2"/> <line x1="10" y1="15" x2="14" y2="9" stroke="var(--wall-color)" stroke-width="2"/> <line x1="15" y1="15" x2="19" y2="9" stroke="var(--wall-color)" stroke-width="2"/> </svg></button><button id="tool-letter" data-editor-tool="letter" class="tool-btn icon-btn" title="字母门" aria-label="字母门"><svg viewBox="0 0 24 24" width="24" height="24"> <line x1="2" y1="12" x2="22" y2="12" stroke="var(--wall-color)" stroke-width="3"/> <text x="12" y="16" font-size="12" fill="var(--key-color)" text-anchor="middle" font-weight="bold" stroke="var(--wall-color)" stroke-width="0.5">A</text> </svg></button><button id="tool-button" data-editor-tool="button" class="tool-btn icon-btn" title="按钮" aria-label="按钮"><svg viewBox="0 0 24 24" width="24" height="24"> <g transform="translate(0 4)"><path d="M6 4 L6 12 L18 12 L18 4" fill="none" stroke="var(--wall-color)" stroke-width="2"/> <text x="12" y="10" font-size="10" fill="var(--key-color)" text-anchor="middle" font-weight="bold">A</text></g> </svg></button><button id="tool-ghost" data-editor-tool="ghost" class="tool-btn icon-btn" title="鬼" aria-label="鬼"><svg viewBox="0 0 24 24" width="24" height="24"> <circle cx="12" cy="12" r="7" fill="var(--ghost-color)"/> </svg></button><button id="tool-key" data-editor-tool="key" class="tool-btn icon-btn" title="钥匙" aria-label="钥匙"><svg viewBox="0 0 24 24" width="24" height="24"> <polygon points="12,4 20,12 12,20 4,12" fill="var(--key-color)"/> </svg></button><button id="tool-start" data-editor-tool="start" class="tool-btn icon-btn" title="出生点" aria-label="出生点"><svg viewBox="0 0 24 24" width="24" height="24"> <circle cx="12" cy="13" r="7" fill="var(--player-color)"/> </svg></button><button id="tool-end" data-editor-tool="end" class="tool-btn icon-btn" title="终点" aria-label="终点"><svg viewBox="0 0 24 24" width="24" height="24"> <circle cx="12" cy="12" r="7" fill="var(--end-point-color)"/> </svg></button><button id="tool-eraser" data-editor-tool="eraser" class="tool-btn icon-btn" title="擦除" aria-label="擦除"><svg viewBox="0 0 24 24" width="24" height="24"> <rect x="5" y="8" width="14" height="12" rx="2" fill="#aaaaaa"/> <rect x="7" y="5" width="10" height="5" fill="#dddddd"/> </svg></button><button id="tool-stair" data-editor-tool="stair" class="tool-btn icon-btn" title="楼梯" aria-label="楼梯"><svg viewBox="0 0 24 24" width="24" height="24"> <path d="M4 20 L4 14 L10 14 L10 8 L16 8 L16 2 L22 2 L22 20 Z" fill="none" stroke="var(--wall-color)" stroke-width="2"/> </svg></button></div><div class="editor-section"><div class="button-row editor-mode-tabs segmented"><button id="editor-mode-death-loop-btn">死亡循环</button><button id="editor-mode-exploration-btn" class="secondary">探索模式</button></div><div class="dimension-fields"><label id="initial-health-container" class="inline-field" hidden>初始生命 <input id="editor-initial-health" type="number" min="1" max="4294967295" value="5"></label><label>宽 <input id="edit
